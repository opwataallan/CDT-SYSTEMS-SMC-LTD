    <meta name="description" content="Premier Ugandan technology and electronics e-commerce marketplace for Cyber Dynamic Technologies, powered by WooCommerce integration with MTN MoMo, Airtel Money, and real-time catalog syncing." />
    <meta property="og:title" content="Cyber Dynamic Technologies Marketplace — Premier Tech & Electronics Uganda" />
    <meta property="og:description" content="Premier Ugandan technology and electronics e-commerce marketplace for Cyber Dynamic Technologies, powered by WooCommerce integration with MTN MoMo, Airtel Money, and real-time catalog syncing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully prevent unhandled WebSocket closure error alerts from Vite dev client in iframe/proxied environments
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket closed without opened') || event.message.includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && String(event.reason).includes('WebSocket closed without opened')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #f8fafc; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="padding: 14px 20px; background: #ffffff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; margin-bottom: 18px;">
          <img src="/logo.png" alt="Cyber Dynamic Technologies" style="width: 220px; max-width: 75vw; height: auto;" />
        </div>
        <div style="width: 180px; height: 3px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: #920d35; border-radius: 9999px;"></div>
        </div>
        <p style="margin-top: 12px; font-size: 13px; color: #64748b; font-weight: 600;">Loading Cyber Dynamic Technologies...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

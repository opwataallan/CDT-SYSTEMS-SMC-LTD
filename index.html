    <title>Cyber Dynamic Technologies Marketplace — Premier Tech & Electronics Uganda</title>
    <meta name="description" content="Premier Ugandan technology and electronics e-commerce marketplace for Cyber Dynamic Technologies, powered by WooCommerce integration with MTN MoMo, Airtel Money, and real-time catalog syncing." />
    <meta property="og:title" content="Cyber Dynamic Technologies Marketplace — Premier Tech & Electronics Uganda" />
    <meta property="og:description" content="Premier Ugandan technology and electronics e-commerce marketplace for Cyber Dynamic Technologies, powered by WooCommerce integration with MTN MoMo, Airtel Money, and real-time catalog syncing." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully prevent unhandled WebSocket closure error alerts from Vite dev client in iframe/proxied environments
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('WebSocket closed without opened') || event.message.includes('WebSocket'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && String(event.reason).includes('WebSocket closed without opened')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f172a; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #ffffff; text-align: center; padding: 20px;">
        <style>
          @keyframes cdtSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes cdtPulse { 0%, 100% { transform: scale(1); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 1; } }
          .cdt-spinner-ring { animation: cdtSpin 1.4s linear infinite; }
          .cdt-glow-pulse { animation: cdtPulse 2.5s ease-in-out infinite; }
        </style>
        <div style="position: relative; width: 136px; height: 136px; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <!-- Ambient Glow -->
          <div class="cdt-glow-pulse" style="position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(146,13,53,0.4) 0%, rgba(245,158,11,0.2) 50%, transparent 70%); filter: blur(12px);"></div>
          
          <!-- Spinning Ring around the Logo -->
          <svg class="cdt-spinner-ring" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;" viewBox="0 0 136 136" fill="none">
            <defs>
              <linearGradient id="cdt-html-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#920d35" />
                <stop offset="50%" stop-color="#f59e0b" />
                <stop offset="100%" stop-color="#580c1f" stop-opacity="0.1" />
              </linearGradient>
            </defs>
            <circle cx="68" cy="68" r="63" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
            <circle cx="68" cy="68" r="63" stroke="url(#cdt-html-grad)" stroke-width="4" stroke-linecap="round" stroke-dasharray="240 120" />
          </svg>

          <!-- Untouched Official CDT Logo -->
          <div style="width: 98px; height: 98px; border-radius: 50%; overflow: hidden; position: relative; z-index: 2; box-shadow: 0 8px 24px rgba(146,13,53,0.4); display: flex; align-items: center; justify-content: center;">
            <img src="/assets/aistudio/272125-removebg-preview_a76dc8ab.png" alt="Cyber Dynamic Technologies" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
        </div>

        <h1 style="font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 4px 0; color: #ffffff; text-transform: uppercase;">
          Cyber Dynamic <span style="color: #f59e0b;">Technologies</span>
        </h1>
        <p style="font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: #94a3b8; text-transform: uppercase; margin: 0 0 20px 0;">
          Technology • Solutions • Growth
        </p>
        <div style="width: 180px; height: 3px; background: rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 55%; height: 100%; background: linear-gradient(90deg, #920d35, #f59e0b); border-radius: 9999px;"></div>
        </div>
        <p style="margin-top: 10px; font-size: 11px; color: #64748b; font-weight: 500;">Initializing marketplace...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

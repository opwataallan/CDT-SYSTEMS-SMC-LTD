<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" width="1920" height="600">
  <defs>
    <!-- Background Gradient: Deep Navy Blue to Rich Maroon to Dark Red -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="35%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#580c1f" />
      <stop offset="100%" stop-color="#920d35" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe58f" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Dark Red & Maroon Glow -->
    <radialGradient id="maroonGlow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#920d35" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#580c1f" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="navyGlow" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Circuit Pattern Filter -->
    <filter id="goldDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1920" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="1500" cy="200" r="450" fill="url(#maroonGlow)" />
  <circle cx="300" cy="500" r="400" fill="url(#navyGlow)" />

  <!-- Tech Geometric & Circuit Line Accents in Gold & Navy -->
  <g stroke="url(#goldGrad)" stroke-opacity="0.25" stroke-width="2" fill="none">
    <path d="M 0 100 L 400 100 L 500 200 L 900 200" />
    <circle cx="500" cy="200" r="5" fill="#f59e0b" fill-opacity="0.6" />
    <path d="M 200 600 L 350 450 L 700 450" />
    <circle cx="350" cy="450" r="5" fill="#f59e0b" fill-opacity="0.6" />
    <path d="M 1200 50 L 1350 200 L 1700 200" />
    <circle cx="1350" cy="200" r="5" fill="#f59e0b" fill-opacity="0.6" />
    <path d="M 1400 550 L 1550 400 L 1920 400" />
  </g>

  <!-- Right Decorative Curved Ribbon: Maroon with Gold Border -->
  <path d="M 1250 0 C 1150 250, 1350 450, 1100 600 L 1920 600 L 1920 0 Z" fill="#580c1f" fill-opacity="0.5" />
  <path d="M 1320 0 C 1220 250, 1420 450, 1180 600" stroke="url(#goldGrad)" stroke-width="6" fill="none" opacity="0.8" />
  <path d="M 1450 0 C 1370 230, 1550 430, 1320 600 L 1920 600 L 1920 0 Z" fill="#920d35" fill-opacity="0.35" />

  <!-- Content Group (Left / Center) -->
  <g transform="translate(100, 110)">
    <!-- Kicker Tag -->
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2" />
    <circle cx="24" cy="21" r="7" fill="#f59e0b" />
    <text x="44" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="14" fill="#ffe58f" letter-spacing="2">
      PREMIER TECH MARKETPLACE
    </text>

    <!-- Main Headline -->
    <text x="0" y="115" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="-1">
      GENUINE COMPUTERS &amp;
    </text>
    <text x="0" y="180" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="56" fill="url(#goldGrad)" letter-spacing="-1">
      ELECTRONICS IN UGANDA
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="20" fill="#e2e8f0">
      Brand-New Laptops, Smart Electronics, High-Speed Printers &amp; Enterprise Networking.
    </text>
    <text x="0" y="270" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="18" fill="#fcd34d">
      Verified Warranty • MTN &amp; Airtel Mobile Money • Same-Day Kampala Delivery
    </text>

    <!-- CTA Button Graphic -->
    <g transform="translate(0, 310)" filter="url(#goldDrop)">
      <rect x="0" y="0" width="220" height="58" rx="14" fill="#920d35" stroke="#f59e0b" stroke-width="2" />
      <text x="110" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="17" fill="#ffffff" text-anchor="middle" letter-spacing="1">
        SHOP CATALOG →
      </text>
    </g>

    <!-- Trust Badges -->
    <g transform="translate(260, 320)">
      <text x="0" y="18" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#cbd5e1">
        ✓ 100% Genuine Brands
      </text>
      <text x="0" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="14" fill="#cbd5e1">
        ✓ Official Uganda Invoices
      </text>
    </g>
  </g>

  <!-- Right Hardware Showcase Graphic -->
  <g transform="translate(1320, 120)" filter="url(#goldDrop)">
    <!-- Glowing Base Pod in Maroon -->
    <ellipse cx="260" cy="380" rx="240" ry="40" fill="#580c1f" opacity="0.6" />
    <ellipse cx="260" cy="380" rx="180" ry="25" fill="#f59e0b" opacity="0.3" />

    <!-- Laptop Silhouetted Representation with Screen Content -->
    <rect x="70" y="90" width="380" height="230" rx="14" fill="#0f172a" stroke="#d97706" stroke-width="4" />
    <!-- Screen Bezel -->
    <rect x="85" y="105" width="350" height="200" rx="8" fill="#1e293b" />
    <rect x="95" y="115" width="330" height="180" rx="6" fill="#0a0f1d" />
    <!-- Screen Graphics: CDT Logo and Wave -->
    <path d="M 95 240 Q 180 180, 260 220 T 425 180 L 425 295 L 95 295 Z" fill="#920d35" opacity="0.8" />
    <path d="M 95 260 Q 200 210, 280 250 T 425 220 L 425 295 L 95 295 Z" fill="#f59e0b" opacity="0.6" />
    <circle cx="260" cy="180" r="32" fill="#580c1f" stroke="#f59e0b" stroke-width="2" />
    <text x="260" y="187" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">CDT</text>
    
    <!-- Laptop Base -->
    <path d="M 30 320 L 490 320 L 520 345 L 0 345 Z" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <rect x="210" y="325" width="100" height="8" rx="4" fill="#cbd5e1" opacity="0.8" />

    <!-- Floating Price Tag Badge in Gold -->
    <g transform="translate(360, 40)">
      <rect x="0" y="0" width="170" height="54" rx="12" fill="#f59e0b" />
      <text x="85" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#78350f" text-anchor="middle" letter-spacing="1">
        BEST PRICES
      </text>
      <text x="85" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#0f172a" text-anchor="middle">
        UGANDA DIRECT
      </text>
    </g>
  </g>
</svg>
